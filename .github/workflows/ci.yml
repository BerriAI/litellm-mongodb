name: Test and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13.13", "3.14.3"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
      - run: uv build --no-sources

  image-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
      - name: Build and exercise the runtime
        env:
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --platform "$IMAGE_PLATFORM" -t mongodb-sidecar-smoke .
          docker run --rm --platform "$IMAGE_PLATFORM" --entrypoint python mongodb-sidecar-smoke -c 'import importlib.util, os, pymongo; from litellm_mongodb.app import create_app; assert os.getuid() == 10001; assert pymongo.version == "4.17.0"; assert all(importlib.util.find_spec(name) is None for name in ("litellm", "openai", "uv")); print("Runtime dependency isolation verified")'
          docker run -d --name mongodb-sidecar-smoke --platform "$IMAGE_PLATFORM" -p 127.0.0.1:8080:8080 -e 'MONGODB_CONNECTION_STRING=mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=1000' -e MONGODB_SIDECAR_API_KEY=image-smoke-only-key mongodb-sidecar-smoke
          trap 'docker rm -f mongodb-sidecar-smoke' EXIT
          # QEMU needs about 20 seconds for imports alone on the ARM64 runner.
          if ! curl --fail --retry 60 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/health/liveness; then
            docker logs mongodb-sidecar-smoke
            docker inspect --format '{{json .State}}' mongodb-sidecar-smoke
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/vector_stores/index/search)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/readiness)" = 503
          curl --fail http://127.0.0.1:8080/health/liveness

  image:
    needs: image-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/berriai/litellm-mongodb:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'candidate' }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ghcr.io/berriai/litellm-mongodb
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create BETA release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'BETA MongoDB Vector Search sidecar for LiteLLM\n\nImage: `ghcr.io/berriai/litellm-mongodb@%s`\n\nSee the README for deployment and compatibility requirements\n' "$IMAGE_DIGEST" > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG (BETA)" --notes-file release-notes.md
