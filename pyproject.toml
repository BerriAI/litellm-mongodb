[project]
name = "litellm-mongodb"
version = "0.1.0b1"
description = "BETA HTTP service for LiteLLM MongoDB Vector Search"
requires-python = ">=3.13"
dependencies = ["fastapi==0.136.3", "pydantic==2.13.4", "pymongo==4.17.0", "uvicorn==0.51.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.15.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litellm_mongodb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
